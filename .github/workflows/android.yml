# Compila el APK firmado de Soporty en los servidores de GitHub.
# Se ejecuta al subir cambios o desde la pestaña Actions → «Compilar APK» → «Run workflow».
name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4

      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Revisar la llave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret KEYSTORE_BASE64. Agrégalo en Settings → Secrets and variables → Actions (ver LEEME.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/soporty.jks"
          echo "SP_KEYSTORE_FILE=$RUNNER_TEMP/soporty.jks" >> "$GITHUB_ENV"

      - name: Compilar APK
        env:
          SP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SP_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          mkdir -p salida
          cp app/build/outputs/apk/release/app-release.apk "salida/soporty-1.0.${GITHUB_RUN_NUMBER}.apk"

      - name: Entregar el APK
        uses: actions/upload-artifact@v4
        with:
          name: soporty-apk-1.0.${{ github.run_number }}
          path: salida/*.apk
          retention-days: 30
